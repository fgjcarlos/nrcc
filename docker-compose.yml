# nrcc — single compose, single Dockerfile, builds locally.
#
# One service, one nrcc + one Node-RED process. To run more stacks on
# the same host, copy this file and remap ports + volume name.
#
#   docker compose up --build
#   open http://localhost:3001 (nrcc UI) and http://localhost:1880 (Node-RED)
#
# Set JWT_SECRET via .env or host env; if absent nrcc generates one in /data.
#
# Ports are bound to 127.0.0.1 (loopback) by default. On a host with
# Tailscale installed the same ports are reachable via the Tailscale
# IP of this host (e.g. http://100.x.y.z:3001) without exposing them
# to the LAN. To expose to the LAN, change the host binding to
# "0.0.0.0" or remove the prefix.
services:
  nrcc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nrcc
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"   # nrcc web UI + API (Tailscale-reachable)
      - "127.0.0.1:1880:1880"   # Node-RED editor (Tailscale-reachable)
    environment:
      PORT: "3001"
      DATA_DIR: /data
      NODE_RED_CMD: node-red
      JWT_SECRET: "${JWT_SECRET:-}"
    volumes:
      - nrcc_data:/data
      - nrcc_backups:/data/backups
      - nrcc_node_modules:/data/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Hardening — single-user container, no new privileges, capped resources.
    # See auditoria/devops-security.md §4. read_only is intentionally omitted:
    # the entrypoint chmods /data and the persisted jwt_secret file needs a
    # writable rootfs.
    init: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 512m
    cpus: "1.0"
    tmpfs:
      - /tmp:size=64m,mode=1777
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 1024

volumes:
  nrcc_data:
  nrcc_backups:
  nrcc_node_modules:
