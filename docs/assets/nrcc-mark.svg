<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="NRCC mark">
  <!--
    NRCC mark: the IEC normally-open contact in its closed state. The
    conductor runs in from each edge and ends in an open terminal ring
    (the contact points); the blade lies flat on the line between them,
    drawn heavier than the conductor. Colours are the app tokens: ink
    #15171c on drawing white #f6f5f0 (frontend/src/index.css).
  -->
  <rect width="16" height="16" rx="2" fill="#f6f5f0"/>
  <g fill="none" stroke="#15171c">
    <line x1="0" y1="8" x2="2.25" y2="8" stroke-width="1.5"/>
    <line x1="13.75" y1="8" x2="16" y2="8" stroke-width="1.5"/>
    <line x1="5.75" y1="8" x2="10.25" y2="8" stroke-width="2.5"/>
    <circle cx="4" cy="8" r="1.75" stroke-width="1.5"/>
    <circle cx="12" cy="8" r="1.75" stroke-width="1.5"/>
  </g>
</svg>
