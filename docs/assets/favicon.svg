<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="NRCC">
  <!--
    NRCC mark: the drawing title block. A solid tile split into a 2x2
    grid that spells N R / C C. Ink tile with drawing-white letters on
    light tabs; inverted on dark tabs so the tile never sinks into the
    tab bar. Letters are stroke paths (no font). Same glyph as
    docs/assets/nrcc-mark.svg and NrccMark.tsx.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .tile { fill: #e9e7df; }
      .cut { stroke: #15171c; }
    }
  </style>
  <rect class="tile" width="32" height="32" fill="#15171c"/>
  <g class="cut" fill="none" stroke="#f6f5f0">
    <line x1="2" y1="16" x2="30" y2="16" stroke-width="1.5"/>
    <line x1="16" y1="2" x2="16" y2="30" stroke-width="1.5"/>
    <g stroke-width="2.25" stroke-linejoin="miter">
      <path d="M4.5 12.5V3.5L11.5 12.5V3.5"/>
      <path d="M20.5 12.5V3.5H24.75A2.25 2.25 0 0 1 24.75 8H20.5M24 8L27.5 12.5"/>
      <path d="M11.2 20.8A4.5 4.5 0 1 0 11.2 27.2"/>
      <path d="M27.2 20.8A4.5 4.5 0 1 0 27.2 27.2"/>
    </g>
  </g>
</svg>
