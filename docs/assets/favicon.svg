<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NRCC">
  <!--
    Favicon variant of the NRCC mark. Same glyph as nrcc-mark.svg;
    kept as a separate file so the docs site carries its own brand at
    the browser-tab level (the application favicon at
    frontend/public/favicon.svg uses a different orange accent and
    can change independently).
  -->
  <rect width="64" height="64" rx="14" fill="#07090d"/>
  <g fill="none" stroke="#0089b4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="32" r="6"/>
    <circle cx="48" cy="32" r="6"/>
    <path d="M32 22 L40 32 L32 42 L24 32 Z"/>
    <path d="M22 32 H24"/>
    <path d="M40 32 H42"/>
  </g>
</svg>