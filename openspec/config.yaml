# OpenSpec / SDD configuration for nrcc.
#
# Generated by the sdd-init phase executor after the parent preflight
# confirmed: execution=auto, artifact_store=openspec, delivery=ask-on-risk,
# review_budget=400. This file is the canonical SDD configuration for the
# project. Do not rewrite destructively without explicit user consent —
# update fields in place and document the change in the PR description.

project:
  name: nrcc
  module: github.com/fgjcarlos/nrcc
  description: >-
    Linux-only Node-RED control center. Single Go binary embeds a React/TypeScript
    frontend and supervises a Node-RED child process. Provides authentication,
    metrics, audit, backups, settings management, and dashboard surfaces.
  primary_paths:
    backend: internal/
    frontend: frontend/src/
    specs: openspec/specs/
    agents_entry: AGENTS.md
    contributing: CONTRIBUTING.md
    changelog: CHANGELOG.md

sdd:
  artifact_store: openspec
  execution_mode: auto
  delivery_strategy: ask-on-risk
  review_budget_lines: 400
  chain_strategy: deferred
  language: en
  specs_index: openspec/specs

strict_tdd:
  enabled: true
  red_green_refactor: true
  requires_failing_test_first: true
  e2e_required_for_user_facing_changes: true
  coverage_gates:
    backend: # CI fails on -coverprofile drop; values are baselines tracked over time.
      statement_minimum: 0
      diff_lines_must_be_covered: true
    frontend:
      vitest_run_required: true
      playwright_e2e_for_new_flows: true

phase_rules:
  ordering: [sdd-init, spec, design, plan, implement, verify, review, deliver]
  skip_conditions:
    # Auto mode allows phases to chain back-to-back, but human-controlled
    # gates (consent, security, destructive, ambiguous scope, size:exception)
    # ALWAYS pause regardless of mode.
    human_gates_always_pause: true
  artifacts_per_phase:
    sdd-init: [openspec/config.yaml, openspec/project.md]
    spec: [openspec/specs/<capability>/spec.md]
    design: [openspec/specs/<capability>/design.md]
    plan: [odd/tasks/<feature>.md]
    implement: [work-unit commits under review_budget_lines]
    verify: [test run output, lint output, build output]
    review: [judgment-day receipts when dual review triggered]
    deliver: [PR with issue-first checks per branch-pr skill]
  review_budget_threshold_lines: 400
  ask_on_risk_triggers:
    - delivery_total_lines_exceeds_review_budget
    - changes_touch_auth_or_secrets
    - changes_touch_destructive_operations
    - ambiguous_scope_or_user_facing_copy
    - new_external_publishing_target

delivery:
  strategy: ask-on-risk
  domain: ask-on-risk
  review_budget_lines: 400
  chain_strategy: deferred
  exception_ok_requires_explicit: true
  human_controlled_gates:
    - consent
    - authorization
    - security
    - destructive_or_publishing
    - ambiguous_scope
    - size:exception

testing:
  runners:
    backend:
      tool: go test
      command: "go test -race -count=1 -timeout 20m ./..."
      conventional_command: "go test ./..."
      coverage_command: "go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out"
      location: repository_root
      required_for: [implement, verify, review]
      e2e: null
    backend_lint:
      tool: golangci-lint
      config: .golangci.yml
      command: "golangci-lint run --config=.golangci.yml ./..."
      ci_gate: repo-wide (not ratcheted); zero findings required
      required_for: [verify]
    frontend_unit:
      tool: vitest
      command: "pnpm --filter frontend test --run"
      conventional_command: "pnpm test --run"
      workspace_dir: frontend/
      required_for: [implement, verify]
    frontend_lint:
      tool: eslint
      command: "pnpm --filter frontend lint"
      required_for: [verify]
    frontend_typecheck:
      tool: typescript
      command: "pnpm --filter frontend typecheck"
      required_for: [verify]
    frontend_e2e:
      tool: playwright
      command: "pnpm --filter frontend test:e2e"
      install_browsers: "pnpm exec playwright install --with-deps chromium"
      spec_dir: frontend/e2e/
      stack_command: "pnpm --filter frontend test:e2e:stack"
      required_for:
        - user_facing_change
        - auth_flow_change
        - new_e2e_capability
  capabilities:
    backend:
      - race detector enabled by default in CI
      - table-driven tests where useful
      - env contract tests in internal/service/env_contract_test.go
      - linux-only build (POSIX syscalls); not buildable on macOS/Windows
    frontend:
      - vitest + @testing-library/react + jsdom
      - msw for HTTP mocking
      - playwright for e2e flows (auth, dashboard, security, i18n, smoke, stack)
      - openapi-typescript codegen for typed API client
      - shared test helpers under features/<name>/__test-utils__/
  ci:
    workflow: .github/workflows/pr.yml
    language_policy_workflow: .github/workflows/language-policy.yml
    i18n_check_workflow: .github/workflows/i18n-check.yml
    security_workflow: .github/workflows/security.yml
    acceptance_workflow: .github/workflows/acceptance.yml

conventions:
  commits: conventional_commits
  branches: [fix/, feat/, chore/, docs/, refactor/, test/, ci/]
  work_unit_max_lines: 400
  english_only: true
  exempt_paths:
    - frontend/src/   # user-facing copy, localized via #767 i18n catalog
    - frontend/e2e/   # e2e specs mirror UI strings
    - auditoria/      # historical audit docs are immutable
    - tools/langscan/ # scanner code + fixtures
    - node_modules/, vendor/, generated artifacts, build outputs
