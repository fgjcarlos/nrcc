# golangci-lint v2 configuration.
#
# The CI job (.github/workflows/pr.yml) runs `golangci-lint run ./...` (no
# only-new-issues) so the gate is repo-wide. Closes #396.
# Extends the security-focused linter set per #596.
version: "2"

linters:
  # Default v2 linters (errcheck, govet, ineffassign, staticcheck, unused) plus
  # gocritic for the opinionated diagnostics requested in #286.
  # Security + correctness additions per #596: gosec (SAST findings),
  # bodyclose (HTTP body leaks), errorlint (proper %w wrapping), nilerr
  # (silently swallowing errors), sqlclosecheck (open DB handles),
  # paralleltest (runable test gates), predeclared (shadowed identifiers),
  # revive (style), tparallel (parallel test correctness), unconvert
  # (redundant conversions), wastedassign (dead writes), usestdlibvars
  # (use http.MethodGet etc.).
  enable:
    - gocritic
    - gosec
    - bodyclose
    - errorlint
    - nilerr
    - paralleltest
    - predeclared
    - revive
    - sqlclosecheck
    - tparallel
    - unconvert
    - wastedassign
    - usestdlibvars

# All new security/correctness linters (added in #596) stay at warning
# severity so the repo-wide CI gate (`only-new-issues: false`) keeps
# passing while the ~200 pre-existing findings are cleaned up in follow-up
# PRs. After the cleanup, promote gosec to 'error' to actually block
# future regressions. Track in audit meta-issue #597.
# See golangci-lint v2 docs: severity.rules matches 'linters' (one
# linter per rule block) and overrides the global severity for those.
severity:
  default: warning
  rules: []
