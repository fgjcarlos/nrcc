name: Acceptance (Docker stacks)

# Issue #434 — proves the one-stack-per-Node-RED model holds across
# multiple Compose projects on the same host (ADR 0003).
#
# This job boots two stacks, recreates one, and restores a backup into a
# third. It only runs on PR (manual gate via label) and on main, never
# on push-from-fork (where secrets and Docker Hub rate limits apply).

on:
  pull_request:
    branches: [main]
    # Limit which PRs kick this off; label-driven so we don't burn CI
    # minutes on every docs PR.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  push:
    branches: [main]

# Cancel previous in-flight runs on the same ref so a force-push doesn't
# queue duplicate stacks on the runner host.
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    name: Docker stack acceptance (#434)
    runs-on: ubuntu-latest
    # Skip on PRs from forks — the bake step requires registry auth we
    # don't want to expose to untrusted contributors.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin to commit (v7.0.0)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # pin to commit (v4.0.0)

      # Build the canonical release image via plain `docker compose build`
      # (no separate `bake` target anymore) and load it into the runner's
      # local daemon. The compose file tags the build as the project-default
      # image name.
      # #664: NRCC_ENCRYPTION_KEY is required at compose interpolation
      # time (the :? form in docker-compose.yml aborts otherwise). Set
      # a fixture value for the acceptance environment so the build and
      # `up` steps can resolve the file. This is a test stack, not a
      # production deployment — the value is well-known and never reused
      # outside this workflow.
      - name: Build release image
        env:
          NRCC_ENCRYPTION_KEY: acceptance-fixture-encryption-key-not-a-secret
        run: docker compose build

      - name: Setup pnpm via corepack
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
          pnpm --version

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # pin to commit (v7.0.0)
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend and Playwright Chromium
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Start real stack for browser acceptance
        env:
          NRCC_ENCRYPTION_KEY: acceptance-fixture-encryption-key-not-a-secret
        run: docker compose up -d --wait --wait-timeout 180

      - name: Playwright against default NRCC and Node-RED stack
        id: default-stack-e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3001
          E2E_NODE_RED_URL: http://127.0.0.1:1880
        run: pnpm exec playwright test --config playwright.stack.config.ts --grep-invert "FlowFuse policy protects deployed HTTP and Socket.IO endpoints"

      # Issue #887: keep the real-runtime evidence (HTML report, traces of
      # failed tests, skip annotations) of the default stack run before the
      # FlowFuse run reuses the same output folders.
      - name: Upload default stack acceptance report and traces
        if: always() && steps.default-stack-e2e.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pin to commit (v4.6.2)
        with:
          name: playwright-stack-acceptance-default
          path: |
            frontend/playwright-report-stack/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Clear Playwright output before the FlowFuse run
        if: always()
        run: rm -rf frontend/playwright-report-stack frontend/test-results

      - name: Stop real browser-acceptance stack
        if: always()
        env:
          NRCC_ENCRYPTION_KEY: acceptance-fixture-encryption-key-not-a-secret
        run: docker compose down -v --remove-orphans

      # The FlowFuse fixture is intentionally isolated from the production-like
      # default stack so the default acceptance coverage remains unchanged.
      - name: Start isolated FlowFuse E2E stack
        run: docker compose -p nrcc-flowfuse-e2e -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 180

      - name: Playwright FlowFuse stack acceptance
        id: flowfuse-stack-e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3301
          E2E_NODE_RED_URL: http://127.0.0.1:31880
        run: pnpm exec playwright test --config playwright.stack.config.ts --grep "FlowFuse policy protects deployed HTTP and Socket.IO endpoints"

      - name: Upload FlowFuse stack acceptance report and traces
        if: always() && steps.flowfuse-stack-e2e.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pin to commit (v4.6.2)
        with:
          name: playwright-stack-acceptance-flowfuse
          path: |
            frontend/playwright-report-stack/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload FlowFuse compose logs on failure
        if: failure()
        run: docker compose -p nrcc-flowfuse-e2e -f docker-compose.e2e.yml logs --no-color --tail=200 || true

      - name: Stop isolated FlowFuse E2E stack
        if: always()
        run: docker compose -p nrcc-flowfuse-e2e -f docker-compose.e2e.yml down -v --remove-orphans

      - name: Install jq for JSON parsing
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      - name: Run acceptance suite
        # #664: same fixture as the build step — the acceptance script
        # invokes `docker compose ... up` which resolves the :? form in
        # docker-compose.yml at startup. The script itself never reads
        # the value (the running container does, via the compose env
        # interpolation), so this just needs to be present in the shell
        # that invokes compose.
        env:
          NRCC_ENCRYPTION_KEY: acceptance-fixture-encryption-key-not-a-secret
        run: bash scripts/acceptance/docker-stacks.sh

      - name: Upload compose logs on failure
        if: failure()
        run: |
          for project in nrcc-acc-a nrcc-acc-b nrcc-acc-c; do
            echo "=== logs for ${project} ==="
            docker compose -p "$project" -f docker-compose.yml logs \
              --no-color --tail=200 || true
            docker compose -p "$project" -f docker-compose.yml down -v \
              --remove-orphans || true
          done
        continue-on-error: true
