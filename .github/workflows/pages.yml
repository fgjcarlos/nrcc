name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  # Allow manual runs from the Actions tab — useful when retrying a stuck deploy
  # or when the landing content changed via a path the trigger filter missed.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let the in-flight one finish before
# the next starts so we never publish a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload and deploy run in separate jobs: when they share one job, the
  # artifact lookup in deploy-pages can come back empty right after the
  # upload finalizes (actions/deploy-pages#451).
  build:
    name: Build docs/ Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin to commit (v7.0.0)

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # pin to commit (v6.0.0)

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # pin to commit (v5.0.0)
        with:
          path: ./docs

  deploy:
    name: Deploy docs/ to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # pin to commit (v5.0.0)
