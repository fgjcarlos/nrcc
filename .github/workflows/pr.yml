name: PR Validation

on:
  pull_request:
  push:
    branches: [main]

# Cancel previous runs on the same PR when new commits land
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go ${{ matrix.go-version }})
    # Fork-PR guard: skip heavy CI on untrusted forks unless a maintainer
    # has explicitly opted in via the `safe-to-test` label. Mirrors the
    # guard already in acceptance.yml:35. See issue #592 and
    # auditoria/devops-security.md §1.3.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # pin to commit (v7.0.0)

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # pin to commit (v7.0.0)
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Install task
        # `task` is not pre-installed on GitHub-hosted runners. Used by the
        # stub-dist step below to keep CI in lock-step with the local
        # `task test` / `task stub-dist` workflow (issue #668).
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin -v v3.44.0

      # `embed.go` declares `//go:embed frontend/dist` — the pattern needs at
      # least one *embeddable* file or `go vet`/`build` fails. Go embed skips
      # files starting with `.` or `_` by default, so a dotfile is not enough.
      # A real frontend build isn't needed for backend validation either, so a
      # plain placeholder satisfies the directive without wasting CI time.
      # Defined once in Taskfile.yml so local + CI share the same workaround.
      - name: Stub frontend/dist for go:embed
        run: task stub-dist

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 -timeout 20m ./...

      - name: Build (all packages)
        run: go build ./...

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    # Fork-PR guard — see the backend job above for the rationale.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # pin to commit (v7.0.0)

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
          pnpm --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # pin to commit (v7.0.0)
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --run

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  openapi:
    name: OpenAPI Spec
    # Fork-PR guard — see the backend job above for the rationale.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # pin to commit (v7.0.0)

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # pin to commit (v7.0.0)
        with:
          node-version: "22"

      - name: Validate OpenAPI spec
        run: npx --yes @redocly/cli lint docs/openapi.yaml --format stylish

  lint:
    name: Lint (golangci-lint)
    # Fork-PR guard — see the backend job above for the rationale.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # pin to commit (v7.0.0)

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # pin to commit (v7.0.0)
        with:
          go-version: "1.25.13"
          cache-dependency-path: go.sum

      # golangci-lint type-checks the packages, so go:embed needs a real file.
      # Same `task stub-dist` workaround as the backend job — single definition
      # lives in Taskfile.yml so local and CI cannot drift apart (issue #668).
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin -v v3.44.0

      - name: Stub frontend/dist for go:embed
        run: task stub-dist

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # pin to commit (v9.0.0)
        with:
          version: v2.12.2
          # Repo-wide gate, not a ratchet: the prior ~72 findings were cleaned
          # up in #396. Keep CI exit 0 = green.
          only-new-issues: false
