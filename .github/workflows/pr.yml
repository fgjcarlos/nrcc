name: PR Validation

on:
  pull_request:
  push:
    branches: [main]
  # Reused by the release workflow to re-run the branch-required checks
  # at the exact triggering SHA instead of trusting unrelated statuses
  # (#884).
  workflow_call:

# Cancel previous runs on the same PR when new commits land.
# The group is workflow specific on purpose: a reusable call inherits the
# caller workflow name, so a shared group would make the release run
# cancel one of its own check workflows (#884).
concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go ${{ matrix.go-version }})
    # Fork-PR guard: skip heavy CI on untrusted forks unless a maintainer
    # has explicitly opted in via the `safe-to-test` label. Mirrors the
    # guard already in acceptance.yml:35. See issue #592 and
    # auditoria/devops-security.md §1.3.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.27.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin to commit (v7.0.0)
        with:
          # Pin the checkout to the exact triggering SHA so a reusable
          # call always validates the candidate commit (#884).
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # pin to commit (v7.0.0)
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Install task
        # `task` is not pre-installed on GitHub-hosted runners. Used by the
        # stub-dist step below to keep CI in lock-step with the local
        # `task test` / `task stub-dist` workflow (issue #668).
        # The official install script takes the version as a positional arg.
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin v3.44.0

      # `embed.go` declares `//go:embed frontend/dist` — the pattern needs at
      # least one *embeddable* file or `go vet`/`build` fails. Go embed skips
      # files starting with `.` or `_` by default, so a dotfile is not enough.
      # A real frontend build isn't needed for backend validation either, so a
      # plain placeholder satisfies the directive without wasting CI time.
      # Defined once in Taskfile.yml so local + CI share the same workaround.
      - name: Stub frontend/dist for go:embed
        run: task stub-dist

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 -timeout 20m ./...

      - name: Build (all packages)
        run: go build ./...

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    # Fork-PR guard — see the backend job above for the rationale.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin to commit (v7.0.0)
        with:
          # Pin the checkout to the exact triggering SHA so a reusable
          # call always validates the candidate commit (#884).
          ref: ${{ github.sha }}

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
          pnpm --version

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # pin to commit (v7.0.0)
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --run

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        id: fixture-e2e
        run: pnpm test:e2e

      # Issue #887: keep the evidence of the mocked-fixture browser suite. These
      # tests run against API mocks (e2e/helpers.ts installApiMocks), so their
      # report proves UI behaviour only, never runtime behaviour.
      - name: Upload fixture E2E report and traces
        if: always() && steps.fixture-e2e.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pin to commit (v4.6.2)
        with:
          name: playwright-fixture-e2e-node-${{ matrix.node-version }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: pnpm build

  openapi:
    name: OpenAPI Spec
    # Fork-PR guard — see the backend job above for the rationale.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin to commit (v7.0.0)
        with:
          # Pin the checkout to the exact triggering SHA so a reusable
          # call always validates the candidate commit (#884).
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # pin to commit (v7.0.0)
        with:
          node-version: "22"

      - name: Validate OpenAPI spec
        run: npx --yes @redocly/cli lint docs/openapi.yaml --format stylish

  lint:
    name: Lint (golangci-lint)
    # Fork-PR guard — see the backend job above for the rationale.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin to commit (v7.0.0)
        with:
          # Pin the checkout to the exact triggering SHA so a reusable
          # call always validates the candidate commit (#884).
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # pin to commit (v7.0.0)
        with:
          go-version: "1.27.4"
          cache-dependency-path: go.sum

      # golangci-lint type-checks the packages, so go:embed needs a real file.
      # Same `task stub-dist` workaround as the backend job — single definition
      # lives in Taskfile.yml so local and CI cannot drift apart (issue #668).
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin v3.44.0

      - name: Stub frontend/dist for go:embed
        run: task stub-dist

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # pin to commit (v9.0.0)
        with:
          # v2.14.0 is the first release whose binary is built with Go 1.27,
          # so it can analyze a module that targets go 1.27.0. v2.12.2 is
          # built with Go 1.26 and refuses that module outright.
          version: v2.14.0
          # Repo-wide gate, not a ratchet: the prior ~72 findings were cleaned
          # up in #396. Keep CI exit 0 = green.
          only-new-issues: false

  # ── Release publication policy (#884) ─────────────────────────────────────
  # The release workflow decides what may be published (strict semver,
  # prerelease channels, optional DockerHub target). Its rules live in
  # scripts/release/metadata.py and are asserted by a standard library
  # test suite, so a change to the publication policy cannot pass CI
  # unnoticed.
  release-policy:
    name: Release policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin to commit (v7.0.0)
        with:
          # Pin the checkout to the exact triggering SHA so a reusable
          # call always validates the candidate commit (#884).
          ref: ${{ github.sha }}

      - name: Run release policy tests
        run: python3 scripts/release/test_workflow.py
