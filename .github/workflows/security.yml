name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  # ── Go vulnerability check ─────────────────────────────────────────────────
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # pin to commit (v7.0.0)

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # pin to commit (v7.0.0)
        with:
          go-version: "1.25.13"
          cache-dependency-path: go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Stub frontend/dist for go:embed
        run: |
          mkdir -p frontend/dist
          echo "ci placeholder" > frontend/dist/placeholder

      - name: Run govulncheck
        run: govulncheck ./...

  # ── Frontend dependency audit ───────────────────────────────────────────────
  npm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # pin to commit (v7.0.0)

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
          pnpm --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # pin to commit (v7.0.0)
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (critical + high)
        run: pnpm audit --audit-level high

  # ── Container image scan ────────────────────────────────────────────────────
  trivy:
    name: Trivy container scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # pin to commit (v7.0.0)

      - name: Build image for scanning
        # Single Dockerfile now — same target as compose's local build.
        run: docker build -f Dockerfile -t nrcc:scan .

      # Non-blocking: base image (nodered/node-red) carries upstream CVEs
      # outside our control. Results are uploaded to GitHub Security tab.
      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # pin to commit (v0.36.0 — latest stable; 0.28.0 tag no longer published)
        with:
          image-ref: nrcc:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.6
        if: always()
        with:
          sarif_file: trivy-results.sarif
